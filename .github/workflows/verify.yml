name: Verificação
on: [push, pull_request]

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m jupyter nbconvert --to notebook --execute IBM_HR_Analytics.ipynb --output /tmp/IBM_HR_Analytics-verificado.ipynb
